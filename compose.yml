name: supermemory
services:
  server:
    # Official 0.0.9 image plus a temporary snapshot patch (services/server); same uid 10001 owns /data.
    # When a fixed release ships, drop `build` and set `image: docker.io/supermemory/supermemory:<version>`.
    build: ./services/server
    image: supermemory-server:0.0.9-snapshot-patch
    init: true
    stop_grace_period: 40s
    restart: unless-stopped
    ports: ["127.0.0.1:6767:6767"]
    volumes: ["sm-data:/data"]
    env_file: [.env]
    # 0.0.9 peaked at 6.5 GB while opening the migrated store; 6g also OOM-killed 0.0.8 under load.
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/v3/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    extra_hosts: ["host.docker.internal:host-gateway"]
  mcp:
    build: ./services/mcp
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m,mode=1777"]
    environment:
      SUPERMEMORY_API_URL: http://server:6767
      MCP_PUBLIC_URL: ${SUPERMEMORY_MCP_URL:-http://localhost:8443/mcp}
      # search_memory reranks with the host's oMLX; remove RERANK_URL to return plain search.
      RERANK_URL: http://host.docker.internal:11434/v1/rerank
      RERANK_MODEL: bge-reranker-v2-m3
    extra_hosts: ["host.docker.internal:host-gateway"]
    expose: ["8788"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./media:/srv/media:ro"]
volumes:
  # Migrated to 0.0.9 on 2026-10-17; the untouched 0.0.8 store stays in volume supermemory_sm-data for rollback.
  sm-data:
    external: true
    name: supermemory_sm-data-009

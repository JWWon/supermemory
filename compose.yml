name: supermemory
services:
  server:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:6767:6767"]
    volumes: ["sm-data:/data"]
    env_file: [.env]
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/v3/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    extra_hosts: ["host.docker.internal:host-gateway"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./media:/srv/media:ro"]
volumes:
  sm-data:

name: supermemory
services:
  server:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:6767:6767"]
    volumes: ["sm-data:/data"]
    env_file: [.env]
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/v3/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    extra_hosts: ["host.docker.internal:host-gateway"]
  mcp:
    build: ./services/mcp
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m,mode=1777"]
    environment:
      SUPERMEMORY_API_URL: http://server:6767
      MCP_PUBLIC_URL: ${SUPERMEMORY_MCP_URL:-http://localhost:8443/mcp}
    expose: ["8788"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./media:/srv/media:ro"]
volumes:
  sm-data:

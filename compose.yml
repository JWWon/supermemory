name: supermemory
services:
  server:
    # Official 0.0.9 image plus patch.py (services/server): disk-backed store, no boot self-kill. Same uid 10001 owns /data.
    # When a fixed release ships, drop `build` and set `image: docker.io/supermemory/supermemory:<version>`.
    build: ./services/server
    image: supermemory-server:0.0.9-disk
    init: true
    # The shutdown snapshot takes about a minute at 1.65 GB; a shorter grace kills it and drops recent writes.
    stop_grace_period: 180s
    restart: unless-stopped
    ports: ["127.0.0.1:6767:6767"]
    volumes: ["sm-data:/data"]
    env_file: [.env]
    # On disk the server runs about 1.4 GiB, 1.7 GiB at boot (2026-11-03); ingestion may add 2 GB.
    # No swap allowance, so a leak restarts this container instead of exhausting the 12 GiB VM for all.
    mem_limit: 6g
    memswap_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/v3/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    extra_hosts: ["host.docker.internal:host-gateway"]
  mcp:
    build: ./services/mcp
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m,mode=1777"]
    environment:
      SUPERMEMORY_API_URL: http://server:6767
      MCP_PUBLIC_URL: ${SUPERMEMORY_MCP_URL:-http://localhost:8443/mcp}
      # search_memory reranks with the host's oMLX; remove RERANK_URL to return plain search.
      RERANK_URL: http://host.docker.internal:11434/v1/rerank
      RERANK_MODEL: bge-reranker-v2-m3
    extra_hosts: ["host.docker.internal:host-gateway"]
    expose: ["8788"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./media:/srv/media:ro"]
volumes:
  # Disk-backed store in /data/pg since 2026-11-03. Volume supermemory_sm-data-009 keeps the last
  # encrypted in-memory snapshot (stock 0.0.9 format) for rollback.
  sm-data:
    external: true
    name: supermemory_sm-data-pg
